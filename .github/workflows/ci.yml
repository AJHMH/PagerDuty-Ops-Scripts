name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,ui]"
      - run: python -m pytest tests/unit tests/ui -v --cov=pagerduty_ops --cov=pagerduty_ops_ui --cov-report=term-missing
      - name: Integration tests (only when a sandbox token is configured)
        env:
          PD_TEST_TOKEN: ${{ secrets.PD_TEST_TOKEN }}
        if: env.PD_TEST_TOKEN != ''
        run: python -m pytest tests/integration -v

  test-windows:
    # The UI service runs on a Windows Server VM (ADR 0005): prove the engine there too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ui]"
      - run: python -m pytest tests/unit tests/ui -v

  sqlserver:
    # The service's tests again on SQL Server, the production database (ADR 0007, #70).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Install first, so no package's build code runs while the password exists.
      - run: pip install -e ".[dev,ui]"
      - name: Install Microsoft ODBC Driver 18 (unless the runner has it)
        run: |
          if ! odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -fsSL -o packages-microsoft-prod.deb \
              "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            sudo dpkg -i packages-microsoft-prod.deb
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
          fi
      - name: Start a throwaway SQL Server (password generated here, never committed)
        run: |
          export MSSQL_SA_PASSWORD="Ci-$(openssl rand -hex 16)-x"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          echo "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD" >> "$GITHUB_ENV"
          # -e NAME passes the value from the environment, not on docker's command line.
          docker run -d --name mssql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD -p 1433:1433 \
            "$MSSQL_IMAGE"
        env:
          # SQL Server 2022, pinned to the image the suite was verified against.
          MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
      - name: Create an empty test database
        run: |
          python .github/scripts/sqlserver_test_database.py
          # The generated password is URL-safe (letters, digits, "-"), so it needs no quoting.
          url="mssql+pyodbc://sa:${MSSQL_SA_PASSWORD}@127.0.0.1:1433/pdops_test"
          url="$url?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
          echo "::add-mask::$url"
          echo "PD_UI_TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Migrations apply cleanly to the empty database
        run: PD_UI_DATABASE_URL="$PD_UI_TEST_DATABASE_URL" pd-ui-migrate
      - name: Service tests on SQL Server
        env:
          PD_UI_TEST_DATABASE_BACKEND: mssql  # fail, rather than pass on SQLite
        run: python -m pytest tests/ui -v

  frontend:
    # The UI's React/TypeScript front end (ui/): typecheck, build, and audit.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-ui.txt
      - name: Secret scan (full history)
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
